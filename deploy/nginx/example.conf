# nginx server blocks for one deployment. Canonical host: www.example.org;
# the apex 301s to it. Replace example.org throughout, and the port if
# LOREM_HOST_PORT moves it. docs/operations.md, "Reverse proxy", says why each
# line is here.
# Logs go to their own directory so a 30-day rotation can cover them alone;
# docs/operations.md, "Logs", has the logrotate rule and the mkdir.
#
#   sudo cp deploy/nginx/example.conf /etc/nginx/sites-available/community.conf
#   sudo ln -s ../sites-available/community.conf /etc/nginx/sites-enabled/community.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo diff -q /etc/nginx/sites-available/community.conf <your edited copy>
#
# Keep the `.conf`. nginx.conf includes sites-enabled/*.conf on most
# distributions, so a file installed under any other name is never read: the
# copy succeeds, `nginx -t` passes against the config that is still there, the
# reload is a no-op, and nothing says the change did not land. The diff is the
# step that proves it did.
#
# ONE host serves the app, the one ORIGIN names. The session cookie is scoped to
# a single apex (from PUBLIC_BASE_DOMAIN) and adapter-node compares the browser's
# Origin header against a single ORIGIN, so a second host reaching the app signs
# a user out on one name and rejects every form action on the other. Every other
# name redirects straight to the canonical host, never through an intermediate.
#
# TLS: issue before installing, because every ssl_certificate path below must
# exist when nginx reloads, and one missing file fails the reload for every
# vhost on the box.
#
#   sudo certbot certonly --nginx -d www.example.org -d example.org \
#     --deploy-hook 'systemctl reload nginx'
#
# `certonly` rather than plain `--nginx`, which would rewrite the installed copy
# of this file and leave the edited copy quietly out of date. --deploy-hook is
# stored in the renewal config at issuance, so a renewed certificate reloads
# nginx by itself.

server {
    listen 80;
    listen [::]:80;
    server_name www.example.org example.org;
    access_log /var/log/nginx/community/access.log;
    error_log  /var/log/nginx/community/error.log warn;

    # Per server block, not http: sibling blocks inherit nothing from each other,
    # and the http block belongs to the host's nginx.conf.
    server_tokens off;

    return 301 https://www.example.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.example.org;
    access_log /var/log/nginx/community/access.log;
    error_log  /var/log/nginx/community/error.log warn;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/www.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.example.org/privkey.pem;

    # Above the app's 2 MB avatar ceiling and BODY_SIZE_LIMIT, so the app's own
    # error is what a member sees rather than a bare nginx 413.
    client_max_body_size 8m;

    # HSTS is the only security header this proxy sets: the responses nginx
    # generates itself (the :80 redirect, a 413, a 502 while the container
    # restarts) never reach the app. The app sets every other header. add_header
    # does not inherit into a location that declares its own, so a new location
    # with a header of its own repeats this line.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:5880;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Without this line ADDRESS_HEADER and XFF_DEPTH make the rate-limit key
        # attacker-chosen: nginx passes a client-supplied X-Forwarded-For through
        # untouched unless the block sets it.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# The apex. A 301 rather than a proxy, for the cookie and ORIGIN reasons at the
# top of this file. No includeSubDomains here: on the apex it would commit every
# sibling name to HTTPS for two years.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name example.org;
    access_log /var/log/nginx/community/access.log;
    error_log  /var/log/nginx/community/error.log warn;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/www.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.example.org/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000" always;

    return 301 https://www.example.org$request_uri;
}
